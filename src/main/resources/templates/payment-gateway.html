<!DOCTYPE html>
<html lang="lt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mokėjimų sistema (imitacija)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body style="background: #eef1f6;">

<div class="container py-5" style="max-width: 520px;">

    <div class="alert alert-warning small">
        <strong>Testinė aplinka.</strong> Tai išorinės mokėjimų sistemos imitacija –
        tikri pinigai nenurašomi, kortelės duomenų įvesti nereikia.
    </div>

    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <strong>MockPay</strong> · saugus mokėjimas
        </div>
        <div class="card-body p-4">
            <p class="text-muted mb-1">Gavėjas</p>
            <p class="fw-semibold">Korepetavimo paslaugų sistema</p>

            <p class="text-muted mb-1">Paskirtis</p>
            <p class="fw-semibold"
               th:text="|${payment.packagePurchase.lessonPackage.name} – ${payment.packagePurchase.lessonPackage.tutor.firstName} ${payment.packagePurchase.lessonPackage.tutor.lastName}|">
                5 pamokų paketas</p>

            <p class="text-muted mb-1">Transakcijos ID</p>
            <p class="font-monospace" th:text="${payment.externalId}">MOCK-1234</p>

            <div class="d-flex justify-content-between align-items-center border-top pt-3 mb-4">
                <span>Suma</span>
                <span class="fs-3 fw-bold" th:text="${@fmt.money(payment.amount)}">95,00 €</span>
            </div>

            <div class="d-grid gap-2">
                <form th:action="@{/payments/{id}/gateway(id=${payment.id})}" method="post">
                    <input type="hidden" name="approve" value="true">
                    <button type="submit" class="btn btn-success btn-lg w-100">Patvirtinti mokėjimą</button>
                </form>
                <form th:action="@{/payments/{id}/gateway(id=${payment.id})}" method="post">
                    <input type="hidden" name="approve" value="false">
                    <button type="submit" class="btn btn-outline-danger w-100">
                        Imituoti nesėkmingą mokėjimą
                    </button>
                </form>
            </div>
        </div>
    </div>

</div>

</body>
</html>
