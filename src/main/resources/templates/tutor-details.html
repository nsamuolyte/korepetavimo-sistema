
<!DOCTYPE html>
<html lang="lt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Korepetitoriaus profilis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5" style="max-width: 800px;">

    <a th:href="@{/tutors}" class="text-decoration-none">
        ← Grįžti į paiešką
    </a>

    <div class="card shadow-sm mt-3">
        <div class="card-body p-4">

            <h2 th:text="|${tutor.user.firstName} ${tutor.user.lastName}|">
                Korepetitorius
            </h2>

            <span class="badge bg-success mb-4">
                Patvirtintas korepetitorius
            </span>

            <p>
                <strong>Mokomas dalykas:</strong>
                <span th:text="${tutor.subject}"></span>
            </p>

            <p>
                <strong>Mokymo lygis:</strong>
                <span th:text="${tutor.educationLevel}"></span>
            </p>

            <p>
                <strong>Patirtis:</strong>
                <span th:text="${tutor.experienceYears}"></span> m.
            </p>

            <p>
                <strong>Kaina:</strong>
                <span th:text="${tutor.hourlyRate}"></span> €/val.
            </p>

            <hr>

            <h5>Apie korepetitorių</h5>

            <p th:text="${tutor.description}">
                Korepetitoriaus aprašymas
            </p>

            <div class="alert alert-secondary mt-4">
                Pamokų rezervacija bus prieinama
                įgyvendinus antrąjį sprintą.
            </div>

        </div>
    </div>

</div>

</body>
</html>
