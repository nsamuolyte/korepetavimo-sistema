<!DOCTYPE html>
<html lang="lt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pranešimai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5" style="max-width: 800px;">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">Pranešimai</h1>
        <form th:action="@{/notifications/read-all}" method="post"
              th:unless="${#lists.isEmpty(notifications)}">
            <button type="submit" class="btn btn-outline-secondary btn-sm">
                Pažymėti visus perskaitytais
            </button>
        </form>
    </div>

    <div th:if="${#lists.isEmpty(notifications)}" class="alert alert-info">Pranešimų nėra.</div>

    <div class="list-group shadow-sm" th:unless="${#lists.isEmpty(notifications)}">
        <a th:each="n : ${notifications}"
           th:href="@{/notifications/{id}/open(id=${n.id})}"
           th:class="${n.read} ? 'list-group-item list-group-item-action' : 'list-group-item list-group-item-action list-group-item-primary'">
            <div class="d-flex justify-content-between">
                <span class="badge bg-secondary mb-1" th:text="${n.type.label}">Tipas</span>
                <small class="text-muted" th:text="${@fmt.dateTime(n.createdAt)}"></small>
            </div>
            <div th:classappend="${n.read} ? '' : 'fw-semibold'" th:text="${n.text}">Pranešimo tekstas</div>
        </a>
    </div>

</div>

</body>
</html>
