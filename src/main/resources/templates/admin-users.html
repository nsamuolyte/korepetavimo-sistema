
<!DOCTYPE html>
<html lang="lt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Naudotojų valdymas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container py-5">

    <a th:href="@{/dashboard}" class="text-decoration-none">
        ← Grįžti į paskyrą
    </a>

    <h1 class="mt-4">Naudotojų valdymas</h1>

    <p class="text-muted">
        Registruotų naudotojų sąrašas ir paskyrų administravimas.
    </p>

    <form th:action="@{/admin/users}"
          method="get"
          class="row g-2 mb-4">

        <div class="col-md-8">
            <input type="text"
                   name="search"
                   class="form-control"
                   placeholder="Ieškoti pagal vardą, pavardę arba el. paštą"
                   th:value="${search}">
        </div>

        <div class="col-md-4">
            <button type="submit" class="btn btn-primary">
                Ieškoti
            </button>

            <a th:href="@{/admin/users}"
               class="btn btn-outline-secondary">
                Išvalyti
            </a>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="table-responsive">

            <table class="table table-hover mb-0">

                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Vardas, pavardė</th>
                    <th>El. paštas</th>
                    <th>Vaidmuo</th>
                    <th>Būsena</th>
                    <th>Veiksmai</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>

                    <td th:text="|${user.firstName} ${user.lastName}|"></td>

                    <td th:text="${user.email}"></td>

                    <td th:text="${user.role}"></td>

                    <td>
                        <span th:if="${user.active}"
                              class="badge bg-success">
                            Aktyvi
                        </span>

                        <span th:unless="${user.active}"
                              class="badge bg-danger">
                            Užblokuota
                        </span>
                    </td>

                    <td>
                        <a th:href="@{/admin/users/{id}(id=${user.id})}"
                           class="btn btn-sm btn-outline-primary">
                            Peržiūrėti
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="6" class="text-center py-4">
                        Naudotojų nerasta.
                    </td>
                </tr>

                </tbody>
            </table>

        </div>
    </div>

</div>

</body>
</html>
