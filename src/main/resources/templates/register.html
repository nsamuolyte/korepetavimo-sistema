<!DOCTYPE html>
<html lang="lt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registracija | Korepetavimo sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5" style="max-width: 520px;">

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <h1 class="h3 mb-4">Registracija</h1>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/register}" method="post">

                <div class="mb-3">
                    <label class="form-label">Vardas</label>
                    <input type="text" name="firstName" class="form-control"
                           required maxlength="100" th:value="${form?.firstName}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Pavardė</label>
                    <input type="text" name="lastName" class="form-control"
                           required maxlength="100" th:value="${form?.lastName}">
                </div>

                <div class="mb-3">
                    <label class="form-label">El. paštas</label>
                    <input type="email" name="email" class="form-control" required maxlength="255"
                           th:value="${form?.email}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Slaptažodis</label>
                    <input type="password" name="password" class="form-control"
                           required minlength="8" maxlength="64">
                    <div class="form-text">8–64 simboliai, bent viena raidė ir vienas skaitmuo.</div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Kas jūs esate?</label>
                    <select name="role" class="form-select" required>
                        <option value="STUDENT" th:selected="${form?.role?.name() == 'STUDENT'}">Mokinys</option>
                        <option value="GUARDIAN" th:selected="${form?.role?.name() == 'GUARDIAN'}">Tėvas / globėjas</option>
                        <option value="TUTOR" th:selected="${form?.role?.name() == 'TUTOR'}">Korepetitorius</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100">Registruotis</button>

            </form>

            <p class="mt-3 mb-0 text-center">
                Jau turite paskyrą? <a th:href="@{/login}">Prisijungti</a>
            </p>

        </div>
    </div>

</div>

</body>
</html>
