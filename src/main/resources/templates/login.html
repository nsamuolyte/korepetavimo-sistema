
<!DOCTYPE html>
<html lang="lt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prisijungimas | Korepetavimo sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container py-5" style="max-width: 460px;">

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <h2 class="mb-4">Prisijungimas</h2>

            <div th:if="${param.error}" class="alert alert-danger">
                Neteisingi prisijungimo duomenys arba paskyra neaktyvi.
            </div>

            <div th:if="${param.logout}" class="alert alert-success">
                Sėkmingai atsijungėte.
            </div>

            <div th:if="${param.registered}" class="alert alert-success">
                Registracija sėkminga. Galite prisijungti.
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label class="form-label">El. paštas</label>
                    <input type="email" name="username"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Slaptažodis</label>
                    <input type="password" name="password"
                           class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Prisijungti
                </button>
            </form>

            <p class="mt-3 mb-0 text-center">
                Neturite paskyros?
                <a th:href="@{/register}">Registruotis</a>
            </p>

        </div>
    </div>
</div>

</body>
</html>
