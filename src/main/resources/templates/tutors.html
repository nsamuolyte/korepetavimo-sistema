
<!DOCTYPE html>
<html lang="lt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Korepetitorių paieška</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container py-5">

    <a th:href="@{/}" class="text-decoration-none">
        ← Pradinis puslapis
    </a>

    <h1 class="mt-4">Korepetitorių paieška</h1>
    <p class="text-muted">
        Raskite jums tinkamiausią korepetitorių.
    </p>

    <div class="card mb-4">
        <div class="card-body">

            <form th:action="@{/tutors}" method="get"
                  class="row g-3">

                <div class="col-md-5">
                    <label class="form-label">Mokomas dalykas</label>
                    <input type="text" name="subject"
                           class="form-control"
                           placeholder="Pvz., matematika"
                           th:value="${subject}">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Maksimali kaina (€)</label>
                    <input type="number" name="maxPrice"
                           min="0" step="0.01"
                           class="form-control"
                           th:value="${maxPrice}">
                </div>

                <div class="col-md-3 d-flex align-items-end gap-2">
                    <button class="btn btn-primary" type="submit">
                        Ieškoti
                    </button>

                    <a th:href="@{/tutors}"
                       class="btn btn-outline-secondary">
                        Išvalyti
                    </a>
                </div>

            </form>
        </div>
    </div>

    <h4 class="mb-3">Korepetitoriai</h4>

    <div th:if="${#lists.isEmpty(tutors)}"
         class="alert alert-info">
        Pagal pasirinktus kriterijus korepetitorių nerasta.
    </div>

    <div class="row g-3">

        <div class="col-md-6" th:each="tutor : ${tutors}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">

                    <h5 th:text="|${tutor.user.firstName} ${tutor.user.lastName}|">
                        Korepetitoriaus vardas
                    </h5>

                    <p>
                        <strong>Dalykas:</strong>
                        <span th:text="${tutor.subject}"></span>
                    </p>

                    <p>
                        <strong>Mokymo lygis:</strong>
                        <span th:text="${tutor.educationLevel}"></span>
                    </p>

                    <p>
                        <strong>Kaina:</strong>
                        <span th:text="${tutor.hourlyRate}"></span> €/val.
                    </p>

                    <a th:href="@{/tutors/{id}(id=${tutor.id})}"
                       class="btn btn-outline-primary">
                        Peržiūrėti profilį
                    </a>

                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
