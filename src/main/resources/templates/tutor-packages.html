<!DOCTYPE html>
<html lang="lt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pamokų paketai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5" style="max-width: 900px;">

    <h1>Pamokų paketai</h1>
    <p class="text-muted">Paketai rodomi jūsų profilyje – mokiniai ir globėjai gali juos įsigyti.</p>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5>Naujas paketas</h5>
            <form th:action="@{/tutor/packages}" method="post" class="row g-2 align-items-end">
                <div class="col-md-5">
                    <label class="form-label">Pavadinimas</label>
                    <input type="text" name="name" class="form-control" maxlength="100"
                           placeholder="Pvz., 5 pamokų paketas" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Pamokų</label>
                    <input type="number" name="lessonCount" class="form-control" min="1" max="50" value="5" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Kaina (€)</label>
                    <input type="number" name="price" class="form-control" min="0.01" step="0.01" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Pridėti</button>
                </div>
            </form>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(packages)}" class="alert alert-info">Paketų dar nėra.</div>

    <table th:unless="${#lists.isEmpty(packages)}" class="table table-bordered bg-white align-middle">
        <thead class="table-light">
        <tr>
            <th>Pavadinimas</th>
            <th>Pamokų</th>
            <th>Kaina</th>
            <th>Būsena</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${packages}">
            <td th:text="${p.name}"></td>
            <td th:text="${p.lessonCount}"></td>
            <td th:text="${@fmt.money(p.price)}"></td>
            <td>
                <span th:if="${p.active}" class="badge bg-success">Parduodamas</span>
                <span th:unless="${p.active}" class="badge bg-secondary">Paslėptas</span>
            </td>
            <td>
                <form th:action="@{/tutor/packages/{id}/toggle(id=${p.id})}" method="post">
                    <input type="hidden" name="active" th:value="${!p.active}">
                    <button type="submit" class="btn btn-sm btn-outline-secondary"
                            th:text="${p.active} ? 'Paslėpti' : 'Vėl parduoti'">Paslėpti</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
