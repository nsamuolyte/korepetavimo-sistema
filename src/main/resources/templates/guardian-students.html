
<!DOCTYPE html>
<html lang="lt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mano mokiniai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container py-5" style="max-width: 800px;">

    <a th:href="@{/dashboard}">← Grįžti į paskyrą</a>

    <h1 class="mt-4">Mano mokiniai</h1>

    <div th:if="${param.unlinked}" class="alert alert-success">
        Susiejimas atšauktas.
    </div>

    <div th:if="${param.requested}" class="alert alert-info">
        Prašymas apdorotas. Jeigu nurodyta aktyvi
        mokinio paskyra, jam išsiųstas susiejimo
        prašymas sistemoje.
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h5>Pridėti mokinį</h5>

            <form th:action="@{/guardian/students}"
                  method="post">

                <label class="form-label">Mokinio el. paštas</label>

                <input type="email"
                       name="studentEmail"
                       class="form-control mb-3"
                       required>

                <button type="submit" class="btn btn-primary">
                    Siųsti susiejimo prašymą
                </button>
            </form>
        </div>
    </div>

    <h4>Susiejimo prašymai</h4>

    <div th:if="${#lists.isEmpty(links)}"
         class="alert alert-secondary">
        Susietų mokinių kol kas nėra.
    </div>

    <div class="card mb-2" th:each="link : ${links}">
        <div class="card-body">

            <h5 th:text="|${link.student.firstName} ${link.student.lastName}|">
                Mokinys
            </h5>

            <span th:switch="${link.status.name()}">

                <span th:case="'PENDING'" class="badge bg-warning text-dark">
                    Laukia patvirtinimo
                </span>

                <span th:case="'APPROVED'" class="badge bg-success">
                    Susietas
                </span>

                <span th:case="'REJECTED'" class="badge bg-danger">
                    Atmestas
                </span>

            </span>

            <form th:if="${link.status.name() != 'REJECTED'}"
                  th:action="@{/guardian/students/{id}/unlink(id=${link.id})}" method="post"
                  class="mt-3"
                  onsubmit="return confirm('Ar tikrai norite atšaukti susiejimą? Nebematysite vaiko pamokų.');">
                <button type="submit" class="btn btn-sm btn-outline-danger"
                        th:text="${link.status.name() == 'PENDING'} ? 'Atšaukti prašymą' : 'Atšaukti susiejimą'">
                    Atšaukti susiejimą
                </button>
            </form>
        </div>
    </div>

</div>
</body>
</html>
