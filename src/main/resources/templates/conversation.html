<!DOCTYPE html>
<html lang="lt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokalbis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <style>
        .bubble { max-width: 75%; white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5" style="max-width: 800px;">

    <a th:href="@{/messages}" class="text-decoration-none">← Visi pokalbiai</a>

    <h1 class="h3 mt-3" th:text="|${partner.firstName} ${partner.lastName}|">Pokalbis</h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm mb-3">
        <div class="card-body" style="max-height: 60vh; overflow-y: auto;" id="chat">

            <div th:if="${#lists.isEmpty(messages)}" class="text-muted text-center py-4">
                Žinučių dar nėra. Parašykite pirmąją!
            </div>

            <div th:each="m : ${messages}"
                 th:class="${m.sender.id == me.id} ? 'd-flex justify-content-end mb-2' : 'd-flex justify-content-start mb-2'">
                <div th:class="${m.sender.id == me.id} ? 'bubble p-2 px-3 rounded-3 bg-primary text-white' : 'bubble p-2 px-3 rounded-3 bg-white border'">
                    <div th:text="${m.content}">Žinutės tekstas</div>
                    <div class="small opacity-75 mt-1 text-end" th:text="${@fmt.dateTime(m.sentAt)}">
                        2026-11-24 19:00
                    </div>
                </div>
            </div>

        </div>
    </div>

    <form th:action="@{/messages/{id}(id=${partner.id})}" method="post">
        <div class="input-group">
            <textarea name="content" class="form-control" rows="2" required
                      th:maxlength="${maxLength}" placeholder="Rašykite žinutę..."></textarea>
            <button type="submit" class="btn btn-primary">Siųsti</button>
        </div>
    </form>

</div>

<script>
    // Automatiškai nuslenkame prie naujausios žinutės.
    var chat = document.getElementById('chat');
    if (chat) { chat.scrollTop = chat.scrollHeight; }
</script>

</body>
</html>
