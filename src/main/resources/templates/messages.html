<!DOCTYPE html>
<html lang="lt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Žinutės</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5" style="max-width: 900px;">

    <h1>Žinutės</h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5>Nauja žinutė</h5>
            <div th:if="${#lists.isEmpty(contacts)}" class="text-muted">
                Kol kas nėra su kuo pradėti pokalbio. Korepetitoriui galite parašyti
                iš jo <a th:href="@{/tutors}">profilio puslapio</a>.
            </div>
            <form th:unless="${#lists.isEmpty(contacts)}" th:action="@{/messages/new}" method="get"
                  class="row g-2 align-items-end">
                <div class="col-md-8">
                    <label class="form-label">Gavėjas</label>
                    <select name="partnerId" class="form-select" required>
                        <option th:each="c : ${contacts}" th:value="${c.id}"
                                th:text="|${c.firstName} ${c.lastName} (${c.role.name() == 'TUTOR' ? 'korepetitorius' : (c.role.name() == 'GUARDIAN' ? 'globėjas' : 'mokinys')})|">
                            Vardas Pavardė
                        </option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-primary w-100">Rašyti</button>
                </div>
            </form>
        </div>
    </div>

    <h4>Pokalbiai</h4>

    <div th:if="${#lists.isEmpty(conversations)}" class="alert alert-info">Pokalbių dar nėra.</div>

    <div class="list-group shadow-sm" th:unless="${#lists.isEmpty(conversations)}">
        <a th:each="c : ${conversations}"
           th:href="@{/messages/{id}(id=${c.partner.id})}"
           class="list-group-item list-group-item-action d-flex justify-content-between align-items-start">
            <div class="me-3">
                <div class="fw-semibold" th:text="|${c.partner.firstName} ${c.partner.lastName}|">Vardas</div>
                <div class="small text-muted text-truncate" style="max-width: 600px;"
                     th:text="${c.lastMessage.content}">Paskutinė žinutė</div>
            </div>
            <div class="text-end">
                <div class="small text-muted" th:text="${@fmt.dateTime(c.lastMessage.sentAt)}"></div>
                <span th:if="${c.unread > 0}" class="badge bg-danger" th:text="${c.unread}">1</span>
            </div>
        </a>
    </div>

</div>

</body>
</html>
