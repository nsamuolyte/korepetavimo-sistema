
<!DOCTYPE html>
<html lang="lt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Korepetitorių tvirtinimas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container py-5">

    <a th:href="@{/dashboard}" class="text-decoration-none">
        ← Grįžti į paskyrą
    </a>

    <h1 class="mt-4 mb-2">Korepetitorių tvirtinimas</h1>
    <p class="text-muted">
        Peržiūrėkite registruotų korepetitorių profilius.
    </p>

    <div th:if="${#lists.isEmpty(tutors)}"
         class="alert alert-info">
        Šiuo metu nėra profilių, laukiančių patvirtinimo.
    </div>

    <div class="card mb-3"
         th:each="tutor : ${tutors}">

        <div class="card-body">

            <h4 th:text="|${tutor.user.firstName} ${tutor.user.lastName}|">
                Korepetitorius
            </h4>

            <p>
                <strong>El. paštas:</strong>
                <span th:text="${tutor.user.email}"></span>
            </p>

            <p>
                <strong>Mokomas dalykas:</strong>
                <span th:text="${tutor.subjectsDisplay}"></span>
            </p>

            <p>
                <strong>Mokymo lygis:</strong>
                <span th:text="${tutor.educationLevel}"></span>
            </p>

            <p>
                <strong>Valandinė kaina:</strong>
                <span th:text="${tutor.hourlyRate}"></span> €
            </p>

            <p>
                <strong>Patirtis:</strong>
                <span th:text="${tutor.experienceYears}"></span> m.
            </p>

            <p>
                <strong>Aprašymas:</strong>
                <span th:text="${tutor.description}"></span>
            </p>

            <div class="d-flex gap-2">

                <form th:action="@{/admin/tutors/{id}/approve(id=${tutor.id})}"
                      method="post">

                    <button type="submit" class="btn btn-success">
                        Patvirtinti
                    </button>
                </form>

                <form th:action="@{/admin/tutors/{id}/reject(id=${tutor.id})}"
                      method="post">

                    <button type="submit" class="btn btn-outline-danger">
                        Atmesti
                    </button>
                </form>

            </div>

        </div>
    </div>

</div>

</body>
</html>
