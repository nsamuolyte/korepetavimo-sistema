
<!DOCTYPE html>
<html lang="lt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mano paskyra | Korepetavimo sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h1>Sveiki, <span th:text="${firstName}">Naudotojau</span>!</h1>

    <p>Jūs sėkmingai prisijungėte.</p>

    <div th:switch="${role}">
        <h3 th:case="'STUDENT'">Mokinio paskyra</h3>
        <h3 th:case="'GUARDIAN'">Tėvų / globėjų paskyra</h3>
        <h3 th:case="'TUTOR'">Korepetitoriaus paskyra</h3>
        <h3 th:case="'ADMIN'">Administratoriaus paskyra</h3>
    </div>
    <div th:if="${role.name() == 'TUTOR'}" class="mt-3">
        <a th:href="@{/tutor/profile}" class="btn btn-primary">
            Tvarkyti korepetitoriaus profilį
        </a>
    </div>

    <div th:if="${role.name() == 'ADMIN'}" class="mt-3">
        <a th:href="@{/admin/tutors}" class="btn btn-primary">
            Tvirtinti korepetitorius
        </a>
    </div>

    <div th:if="${role.name() == 'ADMIN'}" class="mt-3">
        <a th:href="@{/admin/users}" class="btn btn-primary">
            Valdyti naudotojus
        </a>
    </div>

    <div th:if="${role.name() == 'GUARDIAN'}" class="mt-3">
        <a th:href="@{/guardian/students}" class="btn btn-primary">
            Mano mokiniai
        </a>
    </div>

    <div th:if="${role.name() == 'STUDENT'}" class="mt-3">
        <a th:href="@{/student/guardians}" class="btn btn-primary">
            Mano globėjai
        </a>
    </div>


    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-outline-danger mt-3">
            Atsijungti
        </button>
    </form>

</div>

</body>
</html>
