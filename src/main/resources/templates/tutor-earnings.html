<!DOCTYPE html>
<html lang="lt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Uždarbis ir išmokos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5" style="max-width: 900px;">

    <h1>Uždarbis ir išmokos</h1>
    <p class="text-muted">Uždarbis skaičiuojamas iš pamokų, pažymėtų kaip įvykusios.</p>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted">Iš viso uždirbta</div>
                    <div class="fs-3 fw-bold" th:text="${@fmt.money(summary.earned)}">60,00 €</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted">Išmokėta / pateikta</div>
                    <div class="fs-3 fw-bold" th:text="${@fmt.money(summary.paidOut)}">20,00 €</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm h-100 border-success">
                <div class="card-body">
                    <div class="text-muted">Galima išmokėti</div>
                    <div class="fs-3 fw-bold text-success" th:text="${@fmt.money(summary.available)}">40,00 €</div>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-5">
        <div class="card-body">
            <h5>Inicijuoti išmokėjimą</h5>
            <form th:action="@{/tutor/earnings/payout}" method="post" class="row g-2 align-items-end"
                  onsubmit="return confirm('Ar tikrai norite pateikti išmokos prašymą?');">
                <div class="col-md-4">
                    <label class="form-label">Suma (€)</label>
                    <input type="number" name="amount" class="form-control" min="0.01" step="0.01"
                           th:max="${summary.available}" th:value="${summary.available}" required>
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-success">Pateikti prašymą</button>
                </div>
            </form>
        </div>
    </div>

    <h4>Išmokų istorija</h4>

    <div th:if="${#lists.isEmpty(payouts)}" class="alert alert-info">Išmokų dar nebuvo.</div>

    <table th:unless="${#lists.isEmpty(payouts)}" class="table table-bordered bg-white">
        <thead class="table-light">
        <tr>
            <th>Data</th>
            <th>Suma</th>
            <th>Būsena</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${payouts}">
            <td th:text="${@fmt.dateTime(p.requestedAt)}"></td>
            <td th:text="${@fmt.money(p.amount)}"></td>
            <td>
                <span th:if="${p.status.name() == 'PAID'}" class="badge bg-success" th:text="${p.status.label}"></span>
                <span th:unless="${p.status.name() == 'PAID'}" class="badge bg-warning text-dark"
                      th:text="${p.status.label}"></span>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
