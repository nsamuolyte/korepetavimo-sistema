
<!DOCTYPE html>
<html lang="lt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Naudotojo informacija</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container py-5" style="max-width: 720px;">

    <a th:href="@{/admin/users}" class="text-decoration-none">
        ← Grįžti į naudotojų sąrašą
    </a>

    <div class="card shadow-sm mt-3">
        <div class="card-body p-4">

            <h2>Naudotojo informacija</h2>

            <hr>

            <p>
                <strong>ID:</strong>
                <span th:text="${user.id}"></span>
            </p>

            <p>
                <strong>Vardas:</strong>
                <span th:text="${user.firstName}"></span>
            </p>

            <p>
                <strong>Pavardė:</strong>
                <span th:text="${user.lastName}"></span>
            </p>

            <p>
                <strong>El. paštas:</strong>
                <span th:text="${user.email}"></span>
            </p>

            <p>
                <strong>Vaidmuo:</strong>
                <span th:text="${user.role}"></span>
            </p>

            <p>
                <strong>Paskyros būsena:</strong>

                <span th:if="${user.active}"
                      class="badge bg-success">
                    Aktyvi
                </span>

                <span th:unless="${user.active}"
                      class="badge bg-danger">
                    Užblokuota
                </span>
            </p>

            <hr>

            <form th:if="${user.active}"
                  th:action="@{/admin/users/{id}/block(id=${user.id})}"
                  method="post">

                <button type="submit" class="btn btn-danger">
                    Užblokuoti paskyrą
                </button>
            </form>

            <form th:unless="${user.active}"
                  th:action="@{/admin/users/{id}/unblock(id=${user.id})}"
                  method="post">

                <button type="submit" class="btn btn-success">
                    Atblokuoti paskyrą
                </button>
            </form>

        </div>
    </div>

</div>

</body>
</html>
