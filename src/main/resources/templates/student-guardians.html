
<!DOCTYPE html>
<html lang="lt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mano globėjai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 800px;">

    <a th:href="@{/dashboard}">← Grįžti į paskyrą</a>

    <h1 class="mt-4">Mano globėjai</h1>

    <p class="text-muted">
        Čia galite patvirtinti arba atmesti
        globėjų susiejimo prašymus.
    </p>

    <div th:if="${#lists.isEmpty(links)}"
         class="alert alert-info">
        Susiejimo prašymų nėra.
    </div>

    <div class="card mb-3" th:each="link : ${links}">
        <div class="card-body">

            <h5 th:text="|${link.guardian.firstName} ${link.guardian.lastName}|">
                Globėjas
            </h5>

            <p th:text="${link.guardian.email}"></p>

            <div th:switch="${link.status.name()}">

                <div th:case="'PENDING'">

                    <span class="badge bg-warning text-dark">
                        Laukia sprendimo
                    </span>

                    <div class="d-flex gap-2 mt-3">

                        <form th:action="@{/student/guardians/{id}/approve(id=${link.id})}"
                              method="post">
                            <button type="submit" class="btn btn-success">
                                Patvirtinti
                            </button>
                        </form>

                        <form th:action="@{/student/guardians/{id}/reject(id=${link.id})}"
                              method="post">
                            <button type="submit" class="btn btn-outline-danger">
                                Atmesti
                            </button>
                        </form>

                    </div>
                </div>

                <span th:case="'APPROVED'" class="badge bg-success">
                    Patvirtintas globėjas
                </span>

                <span th:case="'REJECTED'" class="badge bg-danger">
                    Atmestas
                </span>

            </div>

        </div>
    </div>

</div>
</body>
</html>
