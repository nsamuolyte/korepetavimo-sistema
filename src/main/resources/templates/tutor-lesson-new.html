<!DOCTYPE html>
<html lang="lt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nauja pamoka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container py-5" style="max-width: 800px;">

    <a th:href="@{/lessons}" class="text-decoration-none">← Grįžti į tvarkaraštį</a>

    <h1 class="mt-4">Sukurti pamoką</h1>
    <p class="text-muted">Suplanuokite pamoką mokiniui, su kuriuo jau dirbate.</p>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${#lists.isEmpty(students)}" class="alert alert-info">
        Kol kas neturite mokinių. Mokinys atsiras sąraše, kai užsirezervuos bent vieną pamoką pas jus.
    </div>

    <div class="card shadow-sm mb-4" th:unless="${#lists.isEmpty(students)}">
        <div class="card-body">
            <form th:action="@{/tutor/lessons/new}" method="post" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Mokinys</label>
                    <select name="studentId" class="form-select" required>
                        <option th:each="s : ${students}"
                                th:value="${s.id}"
                                th:text="|${s.firstName} ${s.lastName}|">Mokinys</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Trukmė</label>
                    <select name="minutes" class="form-select">
                        <option th:each="d : ${durations}" th:value="${d}"
                                th:text="|${d} min.|">60 min.</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Data</label>
                    <input type="date" name="date" class="form-control" required
                           th:min="${minDate}" th:max="${maxDate}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Pradžios laikas</label>
                    <input type="time" name="time" class="form-control" step="1800" required>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Sukurti pamoką</button>
                </div>
            </form>
        </div>
    </div>

    <h5>Jūsų darbo laikas</h5>
    <div th:if="${#lists.isEmpty(availabilities)}" class="alert alert-warning">
        Darbo laikas nenustatytas. <a th:href="@{/tutor/availability}">Nustatyti darbo laiką</a>.
    </div>
    <ul class="list-group" th:unless="${#lists.isEmpty(availabilities)}">
        <li class="list-group-item" th:each="a : ${availabilities}"
            th:text="|${@fmt.day(a.dayOfWeek)}: ${@fmt.time(a.startTime)}–${@fmt.time(a.endTime)}|"></li>
    </ul>

</div>

</body>
</html>
