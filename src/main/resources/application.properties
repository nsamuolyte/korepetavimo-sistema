
spring.application.name=korepetavimo-sistema

# Vietines duomenu bazes nustatymai
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5433/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA nustatymai
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Schema valdoma Flyway migracijomis (src/main/resources/db/migration).
# Hibernate tik patikrina, ar esybės atitinka lenteles.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway: esamose DB (sukurtose anksčiau per ddl-auto=update) V1 sukuria tik trūkstamas lenteles,
# o V2 pašalina senus enum CHECK apribojimus.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
