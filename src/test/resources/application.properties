# Testų konfigūracija: H2 duomenų bazė atmintyje PostgreSQL suderinamumo režimu.
# Šis failas testų metu pakeičia src/main/resources/application.properties.
spring.application.name=korepetavimo-sistema-test
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:korepetavimas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Testuose schema kuriama iš esybių (H2), Flyway migracijos (PostgreSQL sintaksė) nevykdomos.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
