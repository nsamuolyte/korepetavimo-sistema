services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    container_name: korepetavimo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Atsarginės kopijos (NFR-P3): pg_dump kas 24 val. į ./backups, senesnės nei 7 d. trinamos
  db-backup:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    container_name: korepetavimo-db-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          file="/backups/$${PGDATABASE}_$$(date +%Y%m%d_%H%M%S).dump"
          if pg_dump -Fc -f "$$file"; then
            echo "$$(date) atsarginė kopija sukurta: $$file"
          else
            echo "$$(date) KLAIDA: atsarginės kopijos sukurti nepavyko" >&2
            rm -f "$$file"
          fi
          find /backups -name '*.dump' -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep $$(( BACKUP_INTERVAL_HOURS * 3600 ))
        done

volumes:
  postgres_data: